# Keyed directly by the real Ollama tag — callers put this exact string in
# the request body's "model" field (e.g. "qwen2.5:7b-instruct-q4_K_M"), not
# an alias. This file's only job is: (1) an allowlist — a model must be
# listed here to be callable at all, so a typo or an unpulled model fails
# with a clear 404 instead of a confusing late error, and (2) optional
# per-model config (currently just daily_limit). The gateway is a pure
# passthrough otherwise — it never adds, removes, or rewrites anything in
# the messages you send; what you send is exactly what the model sees.
# To add a model: add an entry here with its real tag, `ollama pull` it if
# new, done — no Python code changes needed.

qwen2.5:7b-instruct-q4_K_M:
  description: "General-purpose 7B instruction-tuned model."
  # Per-API-key cap on how many /v1/jobs submissions of this model are
  # accepted in a rolling 24 hours, across all callers/use-cases. Enforced
  # against job history in job_store.py — not RATE_LIMIT_PER_MINUTE, which is
  # a short-window, model-agnostic limit and can't express "per model, per
  # day" on its own. Remove this line for no cap.
  daily_limit: 200

meditron:7b-q4_K_M:
  description: "Optional: domain-tuned model for narrow clinical-terminology Q&A. Only ~4K token context — not suitable for multi-source data synthesis; kept here for side-by-side comparison if you want it."
